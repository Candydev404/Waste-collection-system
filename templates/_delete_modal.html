{# One confirmation dialog shared by every delete button (see static/script.js). #}
<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <form method="post" class="modal-content" id="deleteForm" action="">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="next" id="deleteNext" value="">
      <div class="modal-header">
        <h2 class="modal-title fs-5" id="deleteModalLabel">Delete this request?</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p class="mb-2">
          You are about to permanently delete request
          <strong id="deleteReference"></strong>.
        </p>
        <p class="mb-0 text-muted small">
          Use this only for duplicate or inappropriate requests. This action cannot be undone.
        </p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-danger"><i class="bi bi-trash3 me-1"></i>Delete request</button>
      </div>
    </form>
  </div>
</div>
