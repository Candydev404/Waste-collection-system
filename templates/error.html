{% extends "base.html" %}
{% block title %}{{ title }} | Waste Collection Request System{% endblock %}

{% block content %}
<section class="section">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="form-card text-center">
          <div class="error-code">{{ code }}</div>
          <h1 class="h4">{{ title }}</h1>
          <p class="text-muted">{{ message }}</p>
          <a href="{{ url_for('index') }}" class="btn btn-primary"><i class="bi bi-house me-1"></i>Back to home</a>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
