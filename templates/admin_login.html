{% extends "base.html" %}
{% block title %}Administrator Login | Waste Collection Request System{% endblock %}

{% block content %}
<section class="login-wrap">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5">
        <div class="form-card login-card">
          <div class="login-head">
            <div class="login-icon"><i class="bi bi-shield-lock"></i></div>
            <h1 class="h4 mb-1">Administrator sign in</h1>
            <p class="text-muted mb-0">Authorised staff only.</p>
          </div>

          <form method="post" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <input type="text" class="form-control" id="username" name="username"
                     value="{{ username }}" autocomplete="username" maxlength="50" required autofocus>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <div class="input-group">
                <input type="password" class="form-control" id="password" name="password"
                       autocomplete="current-password" required>
                <button class="btn btn-outline-secondary" type="button" id="togglePassword"
                        aria-label="Show password" aria-pressed="false">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 btn-lg">Sign in</button>
          </form>
        </div>
        <p class="text-center mt-3 small"><a href="{{ url_for('index') }}" class="link-muted"><i class="bi bi-arrow-left me-1"></i>Back to the public site</a></p>
      </div>
    </div>
  </div>
</section>
{% endblock %}
